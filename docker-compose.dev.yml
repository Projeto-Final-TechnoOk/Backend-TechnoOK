services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: technook-backend-dev

    ports:
      - '3000:3000'

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    networks:
      - technook-network-dev

networks:
  technook-network-dev:
    external: true
